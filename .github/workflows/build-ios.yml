name: Build iOS IPA (Unity Xcode)
run-name: Build Mod - ${{ inputs.client_session_id || 'manual' }} (#${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Chế độ build IPA'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - 'unsigned'   # Không cần tài khoản Apple Developer (cho TrollStore, AltStore, Sideloadly, Scarlet, ESign)
          - 'signed'     # Ký chứng chỉ Apple Developer (cần cấu hình Secrets: P12, Provisioning Profile)
      xcode_version:
        description: 'Phiên bản Xcode'
        required: true
        default: '15.4'
        type: choice
        options:
          - '15.4'       # Khuyên dùng: Tương thích hoàn hảo Unity 2022.3 LTS
          - '16.1'       # Bản mới nhất
      client_session_id:
        description: 'Session ID của User (Độc lập dữ liệu người dùng)'
        required: false
        default: 'usr_default'
        type: string
      source_tag:
        description: 'Tag GitHub Release chứa file zip source (cô lập cho từng user)'
        required: false
        default: 'base-template-v1'
        type: string
      custom_app_name:
        description: 'Tên Ứng Dụng Mod tùy chỉnh'
        required: false
        default: ''
        type: string
      custom_bundle_id:
        description: 'Bundle ID riêng cho bản mod'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build IPA (${{ inputs.build_mode || 'unsigned' }}) - ${{ inputs.client_session_id || 'usr_default' }}
    runs-on: macos-14   # Runner Apple Silicon (M1) - Tốc độ compile IL2CPP nhanh gấp 3 lần Intel
    permissions:
      contents: write

    env:
      CONFIGURATION: Release

    steps:
      - name: 📥 Checkout repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: ⚙️ Setup Xcode ${{ inputs.xcode_version || '15.4' }}
        run: |
          XCODE_VER="${{ inputs.xcode_version || '15.4' }}"
          if [ -d "/Applications/Xcode_${XCODE_VER}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VER}.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app"
          fi
          xcodebuild -version

      - name: 📦 Chuẩn bị source code Xcode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLIENT_ID="${{ inputs.client_session_id || 'usr_default' }}"
          SOURCE_TAG="${{ inputs.source_tag || 'base-template-v1' }}"
          echo "📥 Đang tải source code tương ứng cho Session: $CLIENT_ID (Tag: $SOURCE_TAG)..."

          # 1. Tải file source từ GitHub Release bằng curl trực tiếp hoặc GitHub CLI
          if [ -n "$SOURCE_TAG" ]; then
            echo "Đang tải release tag $SOURCE_TAG từ GitHub..."
            curl -f -L -s -S "https://github.com/${{ github.repository }}/releases/download/$SOURCE_TAG/mod_source.zip" -o mod_source.zip || \
            curl -f -L -s -S "https://github.com/${{ github.repository }}/releases/download/$SOURCE_TAG/xcode.zip" -o xcode.zip || \
            gh release download "$SOURCE_TAG" --repo "${{ github.repository }}" --pattern "*.zip" --clobber || true
          fi

          # 2. Giải nén source code nếu ở dạng zip
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Phát hiện $ZIP_FILE, đang giải nén..."
            unzip -q "$ZIP_FILE"
          elif [ -f "xcode.zip" ] && [ ! -d "xcode" ]; then
            echo "Phát hiện xcode.zip, đang giải nén..."
            unzip -q xcode.zip
          fi

          # 3. Định vị file .xcodeproj bất kỳ (hỗ trợ mọi project mod / framework)
          XCODE_PROJ=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -1)
          if [ -z "$XCODE_PROJ" ]; then
            echo "❌ Không tìm thấy file .xcodeproj trong source code!"
            exit 1
          fi
          XCODE_DIR=$(dirname "$XCODE_PROJ")
          PROJ_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          echo "XCODE_DIR=$XCODE_DIR" >> $GITHUB_ENV
          echo "PROJECT_NAME=$PROJ_NAME" >> $GITHUB_ENV

          # 4. Lấy Scheme tương ứng (Ưu tiên App scheme thay vì thư viện con GameAssembly / Framework)
          ALL_SCHEMES=$(xcodebuild -list -project "$XCODE_PROJ" 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[ \t]*//;s/[ \t]*$//' | grep -v '^$' || true)
          echo "Danh sách Schemes tìm thấy: $ALL_SCHEMES"

          SCHEME=""
          if echo "$ALL_SCHEMES" | grep -qx "$PROJ_NAME"; then
            SCHEME="$PROJ_NAME"
          elif echo "$ALL_SCHEMES" | grep -qx "Unity-iPhone"; then
            SCHEME="Unity-iPhone"
          else
            # Lọc bỏ các scheme thư viện / framework phụ
            FILTERED_SCHEME=$(echo "$ALL_SCHEMES" | grep -vE '^(GameAssembly|UnityFramework|Pods)' | head -1 || true)
            SCHEME="${FILTERED_SCHEME:-$(echo "$ALL_SCHEMES" | head -1)}"
          fi

          if [ -z "$SCHEME" ]; then
            SCHEME="$PROJ_NAME"
          fi
          echo "SCHEME_NAME=$SCHEME" >> $GITHUB_ENV
          echo "🎯 Đã chọn Scheme chính: $SCHEME (Dự án: $PROJ_NAME | Thư mục: $XCODE_DIR)"

          # 5. Tùy biến Bundle ID và App Name riêng cho từng User
          CUSTOM_BID="${{ inputs.custom_bundle_id }}"
          CUSTOM_NAME="${{ inputs.custom_app_name }}"

          if [ -n "$CUSTOM_BID" ]; then
            echo "⚙️ Đang áp dụng Bundle ID cá nhân cho App: $CUSTOM_BID"
            # Chỉ thay đổi Bundle ID của App chính trong Info.plist (tránh chạm vào UnityFramework / Pods / Frameworks phụ)
            find "$XCODE_DIR" -name "Info.plist" ! -path "*UnityFramework*" ! -path "*Frameworks*" ! -path "*Pods*" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $CUSTOM_BID" {} \; 2>/dev/null || true
            
            # Cập nhật project.pbxproj: Chỉ thay đổi bundle id của App chính, bảo toàn com.unity3d.framework
            python3 -c "import re; p = '$XCODE_PROJ/project.pbxproj'; c = open(p, 'r', encoding='utf-8').read(); c = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = (?!\x22?com\.unity3d)[^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = $CUSTOM_BID;', c); open(p, 'w', encoding='utf-8').write(c); print('✓ pbxproj updated')" 2>/dev/null || true

            # Khôi phục dự phòng cho UnityFramework Info.plist nếu có
            find "$XCODE_DIR" -path "*UnityFramework*Info.plist" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.unity3d.framework" {} \; 2>/dev/null || true
          fi

          if [ -n "$CUSTOM_NAME" ]; then
            echo "⚙️ Đang áp dụng Tên App Mod cá nhân: $CUSTOM_NAME"
            find "$XCODE_DIR" -name "Info.plist" ! -path "*UnityFramework*" ! -path "*Frameworks*" ! -path "*Pods*" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $CUSTOM_NAME" {} \; 2>/dev/null || true
            find "$XCODE_DIR" -name "Info.plist" ! -path "*UnityFramework*" ! -path "*Frameworks*" ! -path "*Pods*" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleName $CUSTOM_NAME" {} \; 2>/dev/null || true
          fi

          # Cấp quyền thực thi nếu có IL2CPP compiler (Unity)
          chmod -R +x "$XCODE_DIR/Il2CppOutputProject/" 2>/dev/null || true
          chmod +x "$XCODE_DIR/process_symbols.sh" 2>/dev/null || true

      - name: 🔐 [SIGNED MODE] Cài đặt Apple Certificate & Provisioning Profile
        if: ${{ (inputs.build_mode == 'signed') || (github.event_name == 'push') }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporal_build_keychain_pass' }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "⚠️ Không tìm thấy Secrets chứng chỉ Apple. Tự động chuyển sang chế độ UNSIGNED!"
            echo "FORCE_UNSIGNED=true" >> $GITHUB_ENV
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          PP_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          # Tạo temporary keychain an toàn
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-settings -lut 21600 "$KEYCHAIN_PATH"

          # Import p12
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Cài đặt Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Cài đặt chứng chỉ và profile thành công!"

      - name: 🏗️ [UNSIGNED MODE] Build & đóng gói Unsigned IPA
        if: ${{ (inputs.build_mode == 'unsigned') || (env.FORCE_UNSIGNED == 'true') }}
        run: |
          echo "🚀 Đang build Unsigned Xcode Archive..."
          ARCHIVE_PATH="$RUNNER_TEMP/${{ env.PROJECT_NAME }}.xcarchive"
          IPA_OUTPUT_DIR="$RUNNER_TEMP/output"
          mkdir -p "$IPA_OUTPUT_DIR"

          xcodebuild archive \
            -project "$XCODE_DIR/${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "📦 Đang đóng gói .app vào Unsigned .ipa..."
          APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy file .app trong archive!"
            echo "Cấu trúc thư mục trong archive:"
            find "$ARCHIVE_PATH" -maxdepth 4 || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/payload_staging/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/payload_staging/Payload/"

          # Đảm bảo CFBundleIdentifier trong Frameworks không bị trùng với App chính
          find "$RUNNER_TEMP/payload_staging/Payload" -path "*/Frameworks/UnityFramework.framework/Info.plist" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.unity3d.framework" {} \; 2>/dev/null || true
          CUSTOM_NAME="${{ inputs.custom_app_name }}"
          SAFE_NAME=$(echo "${CUSTOM_NAME:-$PROJECT_NAME}" | tr -cd '[:alnum:]_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="AppMod"; fi
          IPA_FILE="${SAFE_NAME}_${{ inputs.client_session_id || 'ipa' }}.ipa"

          cd "$RUNNER_TEMP/payload_staging"
          zip -r -y "$IPA_OUTPUT_DIR/$IPA_FILE" Payload
          echo "IPA_FILE_NAME=$IPA_FILE" >> $GITHUB_ENV
          echo "✅ Đã tạo thành công: $IPA_FILE"
          ls -lh "$IPA_OUTPUT_DIR"

      - name: 🏗️ [SIGNED MODE] Build & Export Signed IPA
        if: ${{ (inputs.build_mode == 'signed') && (env.FORCE_UNSIGNED != 'true') }}
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY || 'Apple Distribution' }}
          PROVISION_NAME: ${{ secrets.PROVISION_NAME }}
        run: |
          echo "🚀 Đang build Signed Xcode Archive..."
          ARCHIVE_PATH="$RUNNER_TEMP/${{ env.PROJECT_NAME }}.xcarchive"
          IPA_OUTPUT_DIR="$RUNNER_TEMP/output"
          mkdir -p "$IPA_OUTPUT_DIR"

          # Build Archive
          xcodebuild archive \
            -project "$XCODE_DIR/${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER_APP="$PROVISION_NAME"

          # Export IPA
          EXPORT_PLIST="ExportOptions.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="$XCODE_DIR/../ExportOptions.plist"
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_OUTPUT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST"

          echo "✅ Đã export Signed IPA thành công!"
          ls -lh "$IPA_OUTPUT_DIR"

      - name: 📤 Upload file IPA lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPA-${{ inputs.client_session_id || 'custom' }}
          path: ${{ runner.temp }}/output/*.ipa
          retention-days: 14

      - name: 🚀 Tạo GitHub Release (Tải trực tiếp file .ipa)
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: release-${{ github.run_number }}-${{ inputs.client_session_id || 'usr' }}
          name: ${{ inputs.custom_app_name || 'Bản Mod' }} #${{ github.run_number }} (${{ inputs.client_session_id || 'usr' }})
          draft: false
          prerelease: false
          files: ${{ runner.temp }}/output/*.ipa

      - name: 🧹 Dọn dẹp Keychain & Secrets (Clean up)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/build_cert.p12" "$RUNNER_TEMP/build_profile.mobileprovision" 2>/dev/null || true
